site_name: Slick Sim
site_description: Exchange simulator that shadows real venues for risk-free strategy testing
site_url: https://slickquant.github.io/slick-sim/
repo_url: https://github.com/SlickQuant/slick-sim
repo_name: SlickQuant/slick-sim
edit_uri: edit/main/docs/
copyright: MIT licensed

docs_dir: docs
site_dir: site

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

nav:
  - Home: README.md
  - Internals:
      - Architecture: architecture.md
      - Order lifecycle: order-lifecycle.md
      - Matching engine: matching-engine.md
      - Order book: order-book.md
      - Market data: market-data.md
      - Adding an exchange: extending.md
  - Integration:
      - Configuration: configuration.md
      - Coinbase: integration-coinbase.md
      - Hyperliquid: integration-hyperliquid.md
  - Known gaps: known-gaps.md
  # Absolute URL: the Doxygen output is copied into site/api/ after the MkDocs
  # build, so it does not exist under docs_dir and a relative path would warn.
  - API Reference: https://slickquant.github.io/slick-sim/api/

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # Mermaid diagrams. Without this custom_fences block every ```mermaid block
  # renders as a plain code listing instead of a diagram.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

# `mkdocs build --strict` turns these into build failures, so a renamed heading
# cannot silently break a cross-reference.
validation:
  links:
    absolute_links: ignore
    unrecognized_links: warn
    anchors: warn

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SlickQuant/slick-sim
