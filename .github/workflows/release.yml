name: Create Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.0.0, etc.

permissions:
  contents: write
  actions: read  # needed to look up and download artifacts from the CI run for this commit

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Reuses the exact Release-config binaries ci.yml already built and tested
      # for this commit, instead of rebuilding from scratch. Requires the tagged
      # commit to already have a successful ci.yml run (e.g. tag a commit that's
      # already on main and has passed CI).
      - name: Find CI run for this commit
        id: ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "${{ github.sha }}" --status success --json databaseId --jq '.[0].databaseId')
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" == "null" ]; then
            echo "::error::No successful CI run found for commit ${{ github.sha }}. Tag a commit on main that has already passed CI before releasing."
            exit 1
          fi
          echo "Found CI run $RUN_ID for commit ${{ github.sha }}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download Windows release build from CI
        uses: actions/download-artifact@v4
        with:
          name: slick-sim-Windows-release
          path: windows-build
          run-id: ${{ steps.ci_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Linux release build from CI
        uses: actions/download-artifact@v4
        with:
          name: slick-sim-Linux-release
          path: linux-build
          run-id: ${{ steps.ci_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"

          WIN_STAGE="slick-sim-${VERSION}-windows-x64"
          mkdir -p "$WIN_STAGE"
          cp windows-build/* "$WIN_STAGE/"
          cp -r config "$WIN_STAGE/"
          cp README.md LICENSE "$WIN_STAGE/"
          zip -r "${WIN_STAGE}.zip" "$WIN_STAGE"

          LINUX_STAGE="slick-sim-${VERSION}-linux-x64"
          mkdir -p "$LINUX_STAGE"
          cp linux-build/* "$LINUX_STAGE/"
          chmod +x "$LINUX_STAGE/slick-sim"
          cp -r config "$LINUX_STAGE/"
          cp README.md LICENSE "$LINUX_STAGE/"
          tar -czf "${LINUX_STAGE}.tar.gz" "$LINUX_STAGE"

      - name: Extract changelog for this version
        id: changelog
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract the section for this version from CHANGELOG.md
            VERSION="${{ github.ref_name }}"
            # Escape dots in version for regex
            VERSION_ESCAPED=$(echo "$VERSION" | sed 's/\./\\./g')
            # Use awk to extract content: start at version header, stop at next ## header
            CHANGES=$(awk "BEGIN{p=0} /^# $VERSION_ESCAPED/{p=1;next} /^# /{p=0} p" CHANGELOG.md | sed '/^$/d')

            if [ -z "$CHANGES" ]; then
              echo "CHANGELOG_CONTENT=No changelog entry found for this version." >> $GITHUB_OUTPUT
            else
              # Escape newlines for GitHub output
              echo "CHANGELOG_CONTENT<<EOF" >> $GITHUB_OUTPUT
              echo "$CHANGES" >> $GITHUB_OUTPUT
              echo "EOF" >> $GITHUB_OUTPUT
            fi
          else
            echo "CHANGELOG_CONTENT=CHANGELOG.md not found." >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.CHANGELOG_CONTENT }}

          draft: true
          prerelease: false
          generate_release_notes: false
          files: |
            slick-sim-*-windows-x64.zip
            slick-sim-*-linux-x64.tar.gz
