name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, so the macOS leg builds for arm64-osx.
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    # Read only by Apple toolchains. Both the vcpkg port builds and slick-sim's own
    # configure inherit it, so everything linked into the macOS binary targets the
    # same release. Left unset, the binary would require whatever macOS the runner
    # image runs. 14.0 is above Apple libc++'s 13.3 floor for the floating-point
    # std::format the sources use.
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'

    steps:
    - uses: actions/checkout@v4

    - name: Clone vcpkg
      shell: bash
      run: git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"

    # The SlickQuant dependency libraries (slick-net, hyperliquid-cpp, ...) build
    # their Release config with -march=native, so the binaries vcpkg produces are
    # tuned to whatever CPU the runner that built them happened to have. Restoring
    # such a cache onto a runner with a narrower instruction set makes the tests
    # die with SIGILL on an AVX-512 opcode inside the dependency:
    #
    #   Program received signal SIGILL
    #   => vmovdqu8 %xmm0,0x20(%rbx)
    #      in slick::net::Websocket<...>::Websocket(...)
    #      from hyperliquid::WebsocketManager::init(...)
    #
    # That is why the Linux Release job failed intermittently and passed on
    # re-run: it depended on which CPU the cache came from. Key the cache on the
    # runner's CPU features so a cache is only ever reused on compatible hardware.
    - name: CPU signature for the vcpkg cache key
      id: cpusig
      shell: bash
      run: |
        case "$RUNNER_OS" in
          Linux)
            raw=$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | tr ' ' '\n' \
                  | grep -E '^(sse4_[12]|avx|avx2|avx512[a-z0-9_]*|bmi[12]|fma)$' | sort -u | tr '\n' ',')
            ;;
          macOS)
            # No /proc/cpuinfo here. The brand string names the chip ("Apple M1 (Virtual)").
            # The OS major version is included too: a macos-latest image bump also brings a
            # new Xcode and SDK, and should start a fresh cache.
            raw="$(uname -m) $(sysctl -n machdep.cpu.brand_string) macOS-$(sw_vers -productVersion | cut -d. -f1)"
            ;;
          *)
            raw=$(wmic cpu get Name /value 2>/dev/null | tr -d '\r' | grep '=' || echo "windows-unknown")
            ;;
        esac
        echo "CPU signature source: $raw"
        # macOS may not ship sha256sum; shasum gives the same digest.
        if command -v sha256sum >/dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
        echo "sig=$(printf '%s' "$raw" | $sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # No vcpkg.json manifest is committed in this repo by design (see CLAUDE.md), so
    # dependencies are installed explicitly in classic mode below.
    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/vcpkg/installed
          ${{ runner.temp }}/vcpkg/downloads
          ${{ runner.temp }}/vcpkg/packages
        key: vcpkg-${{ runner.os }}-cpu${{ steps.cpusig.outputs.sig }}-${{ hashFiles('.github/workflows/ci.yml') }}

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

    - name: Bootstrap vcpkg (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    # vcpkg's quickfix port excludes arm64-osx, which covers every macos-latest runner.
    # Only the FIX/JSON parsers need it, so macOS builds without them (see Configure CMake).
    - name: Install dependencies via vcpkg
      shell: bash
      run: |
        quickfix=quickfix
        if [ "$RUNNER_OS" = "macOS" ]; then quickfix=; fi
        "${{ runner.temp }}/vcpkg/vcpkg" install \
          $quickfix \
          nlohmann-json \
          foonathan-memory \
          boost-uuid \
          boost-multiprecision \
          gtest \
          slick-logger \
          slick-socket \
          slick-object-pool \
          coinbase-advanced-cpp \
          slickquant-hyperliquid-cpp \
          "uwebsockets[core,ssl,zlib]"

    - name: Configure CMake
      shell: bash
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
        -DSLICK_SIM_ENABLE_FIX_JSON_PARSERS=${{ runner.os == 'macOS' && 'OFF' || 'ON' }}

    # The Release binaries are shipped, so nothing compiled into them may be tuned to
    # this runner's CPU. A fetched dependency is the way that happens unnoticed:
    # slick-orderbook arrives through FetchContent with -march=native on by default.
    # CMakeLists.txt overrides it from ENABLE_NATIVE_ARCH, and this step checks that
    # override still holds. On macOS the flag is worse than non-portable, because
    # Apple clang on arm64 can reject it outright. MSVC has no -march, and the Visual
    # Studio generator writes no flags.make, so Windows is skipped.
    - name: Assert no -march=native in the Release build
      if: matrix.build_type == 'Release' && runner.os != 'Windows'
      shell: bash
      run: |
        # Fail rather than pass vacuously if the generator stops writing flags.make.
        n=$(find build -name flags.make | wc -l)
        echo "Checking $n flags.make files"
        test "$n" -gt 0
        if grep -rl --include=flags.make -e '-march=native' build; then
          echo "::error::the targets above compile with -march=native; the uploaded Release binary would not be portable"
          exit 1
        fi

    # Bare --parallel means an unbounded `make -j`, which starts every translation unit
    # at once. At ~60 of them the Linux runner ran out of memory and was terminated
    # mid-build, and the macOS one (3 cores, 7 GB) swaps, so both build one job per core.
    # Windows (MSBuild) sets its own count.
    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel ${{ runner.os == 'macOS' && '3' || runner.os == 'Linux' && '"$(nproc)"' || '' }}

    - name: Run tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

    # The Linux Release job intermittently dies with SIGILL inside the tests that
    # construct an Exchange or a gateway; ctest only reports "Exception: Illegal"
    # with no location. Re-run the failures under gdb to capture where and on
    # which thread, since the crash cannot be reproduced on Windows or in Debug.
    - name: Capture backtrace on test failure (Linux)
      if: failure() && runner.os == 'Linux'
      working-directory: build
      run: |
        sudo apt-get update && sudo apt-get install -y gdb
        ulimit -c unlimited
        # Ask ctest which tests failed, then run each under gdb.
        failed=$(ctest -C ${{ matrix.build_type }} -N --rerun-failed 2>/dev/null \
                 | sed -n 's/^ *Test *#[0-9]*: //p' | head -5)
        if [ -z "$failed" ]; then
          echo "ctest reported no rerun-failed list; falling back to the first exchange test"
          failed="HyperliquidRestTest.PlaceOrder_BuyLimit_Gtc_ReturnsResting"
        fi
        for t in $failed; do
          echo "::group::gdb backtrace for $t"
          gdb -batch -return-child-result \
              -ex "run" \
              -ex "echo \n===== signal / faulting frame =====\n" \
              -ex "bt" \
              -ex "echo \n===== all threads =====\n" \
              -ex "thread apply all bt" \
              -ex "info registers rip" \
              -ex "x/8i \$rip" \
              --args ./tests/slick_sim_tests --gtest_filter="$t" || true
          echo "::endgroup::"
        done

    # Release-config artifacts are uploaded here so release.yml can reuse this
    # exact, already-tested build instead of recompiling from scratch on tag push.
    - name: Stage release artifact (Windows)
      if: matrix.build_type == 'Release' && runner.os == 'Windows'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path release-stage | Out-Null
        $exe = Get-ChildItem -Path build -Recurse -Filter slick-sim.exe | Select-Object -First 1
        Copy-Item $exe.FullName -Destination release-stage
        Copy-Item "${{ runner.temp }}\vcpkg\installed\x64-windows\bin\*.dll" -Destination release-stage -ErrorAction SilentlyContinue

    - name: Stage release artifact (Linux)
      if: matrix.build_type == 'Release' && runner.os == 'Linux'
      shell: bash
      run: |
        mkdir -p release-stage
        find build -type f -name slick-sim -exec cp {} release-stage/ \;
        cp "${{ runner.temp }}/vcpkg/installed/x64-linux/lib/"*.so* release-stage/ 2>/dev/null || true

    # vcpkg's arm64-osx triplet is static, so no dylibs ship alongside the binary. The
    # step asserts that, because a Homebrew library resolved in place of vcpkg's would
    # load fine on this runner and then fail on a user's machine. It also asserts the
    # deployment target took effect, since the job env above is easy to lose silently.
    - name: Stage release artifact (macOS)
      if: matrix.build_type == 'Release' && runner.os == 'macOS'
      shell: bash
      run: |
        mkdir -p release-stage
        find build -type f -name slick-sim -exec cp {} release-stage/ \;
        bin=release-stage/slick-sim
        otool -L "$bin"
        if otool -L "$bin" | tail -n +2 | grep -vE '^[[:space:]]*(/usr/lib/|/System/Library/)'; then
          echo "::error::slick-sim links the dylibs above from outside the OS; the release archive would not run elsewhere"
          exit 1
        fi
        minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/ { f = 1 } f && $1 == "minos" { print $2; exit }')
        echo "minos: $minos (expected $MACOSX_DEPLOYMENT_TARGET)"
        test "$minos" = "$MACOSX_DEPLOYMENT_TARGET"

    - name: Upload release build artifact
      if: matrix.build_type == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: slick-sim-${{ runner.os }}-release
        path: release-stage/*

  # Test optional venue configurations, including all venues disabled.
  # Each configuration installs only its declared dependencies, so an accidental
  # dependency on a venue SDK fails to configure or link. The full build installs
  # every SDK and cannot detect that dependency leak.
  venue-options:
    name: venue options (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Build without venue SDKs, QuickFIX or slick-net. HTTP/WS adapters own
          # slick-net, so disabling them also removes main.cpp's log bridge
          # (SLICK_SIM_HAS_SLICK_NET is unset). This catches core networking dependencies.
          - name: no venues
            slug: none
            cmake_flags: >-
              -DSLICK_SIM_ENABLE_COINBASE=OFF
              -DSLICK_SIM_ENABLE_HYPERLIQUID=OFF
              -DSLICK_SIM_ENABLE_TCP_GATEWAY=OFF
            venue_packages: ''
            expect_venues: 'none'
          - name: coinbase only
            slug: coinbase
            cmake_flags: >-
              -DSLICK_SIM_ENABLE_HYPERLIQUID=OFF
              -DSLICK_SIM_ENABLE_TCP_GATEWAY=OFF
            venue_packages: '"uwebsockets[core,ssl,zlib]" slick-net jwt-cpp coinbase-advanced-cpp'
            expect_venues: 'coinbase'
          - name: hyperliquid only
            slug: hyperliquid
            cmake_flags: >-
              -DSLICK_SIM_ENABLE_COINBASE=OFF
              -DSLICK_SIM_ENABLE_TCP_GATEWAY=OFF
            venue_packages: '"uwebsockets[core,ssl,zlib]" slick-net slickquant-hyperliquid-cpp'
            expect_venues: 'hyperliquid'

    steps:
    - uses: actions/checkout@v4

    - name: Clone vcpkg
      shell: bash
      run: git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"

    # Same reasoning as build-and-test: the SlickQuant dependencies build Release
    # with -march=native, so a cache must only be reused on compatible hardware.
    - name: CPU signature for the vcpkg cache key
      id: cpusig
      shell: bash
      run: |
        raw=$(grep -m1 '^flags' /proc/cpuinfo | cut -d: -f2 | tr ' ' '\n' \
              | grep -E '^(sse4_[12]|avx|avx2|avx512[a-z0-9_]*|bmi[12]|fma)$' | sort -u | tr '\n' ',')
        echo "CPU signature source: $raw"
        echo "sig=$(printf '%s' "$raw" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # Keyed on the configuration slug as well: each entry installs a different set
    # of packages into its vcpkg tree, so they must not share a cache entry.
    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/vcpkg/installed
          ${{ runner.temp }}/vcpkg/downloads
          ${{ runner.temp }}/vcpkg/packages
        key: vcpkg-venues-${{ matrix.slug }}-${{ runner.os }}-cpu${{ steps.cpusig.outputs.sig }}-${{ hashFiles('.github/workflows/ci.yml') }}

    - name: Bootstrap vcpkg
      shell: bash
      run: |
        "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    # Install the core dependencies plus this configuration's venue packages.
    # slick_sim_core names slick::queue directly, so CMake resolves it explicitly
    # instead of relying on slick-logger. Optional dependencies are slick-net and
    # uWebSockets for HTTP/WS, jwt-cpp for Coinbase, and slick-socket for TCP.
    # The no-venues entry checks that the core builds without wire protocols.
    # slick-orderbook uses FetchContent when find_package cannot find it.
    - name: Install dependencies via vcpkg
      shell: bash
      run: |
        "${{ runner.temp }}/vcpkg/vcpkg" install \
          nlohmann-json \
          jwt-cpp \
          foonathan-memory \
          boost-uuid \
          boost-multiprecision \
          gtest \
          slick-logger \
          slick-object-pool \
          slick-queue \
          ${{ matrix.venue_packages }}

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
          ${{ matrix.cmake_flags }} 2>&1 | tee configure.log

    # src/venues/CMakeLists.txt prints exactly which adapters were enabled. Assert
    # it, so a typo in an option name shows up as a failure rather than as a job
    # that quietly builds the default configuration and passes.
    - name: Assert the enabled venue set
      shell: bash
      env:
        EXPECT: ${{ matrix.expect_venues }}
      run: |
        echo "Expecting venues: $EXPECT"
        # Anchored on a space or end-of-line so "coinbase" does not also match
        # "coinbase;hyperliquid" - which is exactly what a mistyped or silently
        # ignored option flag would produce.
        grep -E "slick-sim venues: ${EXPECT}( |\$)" configure.log

    # One job per core: an unbounded `make -j` runs the runner out of memory (see build).
    - name: Build
      run: cmake --build build --parallel "$(nproc)"

    - name: Run tests
      working-directory: build
      run: ctest --output-on-failure

    # An enabled venue with no compiled adapter must fail at startup.
    - name: Assert an unbuilt venue key is rejected at startup
      if: matrix.slug == 'none'
      shell: bash
      working-directory: build
      run: |
        mkdir -p logs           # startup aborts with exit 3 and no output without it
        set +e
        output=$(./src/slick-sim ../config/slick_sim.json 2>&1)
        status=$?
        set -e
        echo "$output"
        echo "exit status: $status"
        test "$status" -ne 0
        echo "$output" | grep -F 'No venue adapter for exchanges."coinbase"'
