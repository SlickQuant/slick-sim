name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Clone vcpkg
      shell: bash
      run: git clone --depth 1 https://github.com/microsoft/vcpkg.git "${{ runner.temp }}/vcpkg"

    # No vcpkg.json manifest is committed in this repo by design (see CLAUDE.md), so
    # dependencies are installed explicitly in classic mode below and cached by OS.
    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          ${{ runner.temp }}/vcpkg/installed
          ${{ runner.temp }}/vcpkg/downloads
          ${{ runner.temp }}/vcpkg/packages
        key: vcpkg-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & "${{ runner.temp }}\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

    - name: Bootstrap vcpkg (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics

    - name: Install dependencies via vcpkg
      shell: bash
      run: |
        "${{ runner.temp }}/vcpkg/vcpkg" install \
          quickfix \
          nlohmann-json \
          jwt-cpp \
          foonathan-memory \
          boost-uuid \
          gtest \
          slick-logger \
          slick-socket \
          slick-object-pool \
          coinbase-advanced-cpp \
          slickquant-hyperliquid-cpp \
          slick-orderbook \
          "uwebsockets[core,ssl,zlib]"

    - name: Configure CMake
      shell: bash
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel

    - name: Run tests
      working-directory: build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure
